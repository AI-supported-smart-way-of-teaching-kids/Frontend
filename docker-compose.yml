services:
  smart-app:
    build: .
    ports:
      - "8081:8081" # Metro
      - "19006:19006" # Web
    volumes:
      - .:/app
      - /app/node_modules # Anonymous volume to prevent local node_modules from overwriting container
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=172.26.132.191 # Use your local IP for mobile connection
    stdin_open: true
    tty: true
